<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD - Clube Recreativo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>CRUD Simples - Clube Recreativo</h1>

  <section class="modulo" id="modulo-socios">
    <h2>Sócios</h2>
    <form id="form-socios">
      <input type="hidden" name="id" />
      <input type="text" name="nome" placeholder="Nome" required />
      <input type="email" name="email" placeholder="E-mail" required />
      <input type="text" name="telefone" placeholder="Telefone" required />
      <button type="submit">Salvar</button>
      <button type="button" class="cancelar" onclick="cancelEdit('socios')">Cancelar edição</button>
    </form>
    <ul id="lista-socios"></ul>
  </section>

  <section class="modulo" id="modulo-aulas">
    <h2>Aulas</h2>
    <form id="form-aulas">
      <input type="hidden" name="id" />
      <input type="text" name="nome" placeholder="Nome da aula" required />
      <input type="text" name="instrutor" placeholder="Instrutor" required />
      <input type="text" name="horario" placeholder="Horário" required />
      <button type="submit">Salvar</button>
      <button type="button" class="cancelar" onclick="cancelEdit('aulas')">Cancelar edição</button>
    </form>
    <ul id="lista-aulas"></ul>
  </section>

  <section class="modulo" id="modulo-consumo">
    <h2>Consumo</h2>
    <form id="form-consumo">
      <input type="hidden" name="id" />
      <input type="text" name="socio_nome" placeholder="Nome do sócio" required />
      <input type="text" name="item" placeholder="Item consumido" required />
      <input type="number" step="0.01" name="valor" placeholder="Valor" required />
      <button type="submit">Salvar</button>
      <button type="button" class="cancelar" onclick="cancelEdit('consumo')">Cancelar edição</button>
    </form>
    <ul id="lista-consumo"></ul>
  </section>

  <section class="modulo" id="modulo-espacos">
    <h2>Espaços</h2>
    <form id="form-espacos">
      <input type="hidden" name="id" />
      <input type="text" name="nome" placeholder="Nome do espaço" required />
      <input type="number" name="capacidade" placeholder="Capacidade" required />
      <input type="text" name="status" placeholder="Status (Livre/Ocupado)" required />
      <button type="submit">Salvar</button>
      <button type="button" class="cancelar" onclick="cancelEdit('espacos')">Cancelar edição</button>
    </form>
    <ul id="lista-espacos"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
